<style>
:root{
  --ink:#111418; --ink-soft:#454b54; --muted:#6b7280; --hair:#e3e6ea;
  --bg:#fbfbfa; --card:#ffffff; --accent:#2563eb;
  --bull:#15803d; --bear:#e11d48;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,
    "Times New Roman",serif;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,
    Arial,sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:var(--sans); font-size:17px; line-height:1.65;
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:1120px; margin:0 auto; padding:0 22px 72px}

/* masthead */
.masthead{text-align:center; padding:56px 0 26px; border-bottom:3px double var(--ink)}
.lockup{
  display:flex; align-items:center; justify-content:center;
  gap:clamp(.34rem,1.2vw,.75rem); flex-wrap:nowrap;
}
/* The mark scales with the name it sits beside, so the lockup keeps
   its proportions from phone to desktop instead of the monogram
   swelling as the type shrinks. It now stands IN the wordline in
   place of the word "DK", so it is sized against cap height. */
.mark{display:block; flex:0 0 auto; line-height:0}
.mark img{display:block; height:clamp(2.05rem,5.8vw,3.5rem); width:auto}
/* ⚠️ Specificity, not just order. `.mark img` is (0,1,1) and a bare
   `.mark-dark` is (0,1,0), so `display:block` won and BOTH marks
   rendered — the cream one over white read as a ghosted second
   monogram. The selectors below match `.mark img`'s weight and add a
   class, so the toggle actually wins. */
.mark img.mark-dark{display:none}
.wordmark{
  font-family:var(--serif); font-weight:700; letter-spacing:.02em;
  font-size:clamp(1.9rem,5.4vw,3.6rem); line-height:1.05; margin:0;
  text-transform:uppercase;
}
.wordmark-text{display:inline-block}
/* Available to a screen reader, absent from the page. */
.sr-only{
  position:absolute; width:1px; height:1px; padding:0; margin:-1px;
  overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; border:0;
}
.tagline{
  margin:.55rem 0 0; color:var(--muted); font-size:.82rem;
  letter-spacing:.18em; text-transform:uppercase;
}
.masthead-meta{margin:.7rem 0 0; color:var(--muted); font-size:.8rem}

/* ⚠️ An article page's nameplate is a LINK, and a link needs its own
   rules. Without these the anchor fell back to browser defaults —
   blue and underlined — and `.mark`'s `display:block` broke the line,
   so the monogram sat alone above a centred blue "DK Street Journal".
   It shipped that way because the front page uses `<h1 class="wordmark
   lockup">` and I reused `.masthead` around a different element,
   assuming the styling would carry. */
.masthead-slim{padding:34px 0 22px}
.masthead-slim .back{
  display:inline-flex; align-items:center; justify-content:center;
  gap:clamp(.3rem,1.1vw,.62rem);
  font-family:var(--serif); font-weight:700; letter-spacing:.02em;
  font-size:clamp(1.15rem,2.4vw,1.6rem); line-height:1;
  color:var(--ink); text-decoration:none;
}
.masthead-slim .back:hover{color:var(--accent)}
/* Smaller than the front page's nameplate: this one sits above a
   single article, not over the whole paper. */
.masthead-slim .mark img{height:clamp(1.45rem,3.2vw,2.1rem)}

/* disclaimer — must not be skimmable past */
.disclaimer{
  margin:26px auto 0; max-width:82ch; padding:20px 22px; background:#fff8f1;
  border:1px solid #f0d9c0; border-left:4px solid #c2410c; border-radius:6px;
}
.disc-head{
  margin:0 0 .6rem; font-family:var(--sans); font-size:.78rem;
  letter-spacing:.14em; text-transform:uppercase; color:#9a3412;
}
.disclaimer p{margin:.5rem 0; font-size:.86rem; line-height:1.6; color:var(--ink-soft)}
.disclaimer strong{color:var(--ink)}
.disc-closer{margin-top:.9rem !important; font-weight:600; color:var(--ink) !important}

/* how it works */
.how{margin:34px auto 0}
.how h2{
  font-family:var(--sans); font-size:.78rem; letter-spacing:.14em;
  text-transform:uppercase; color:var(--muted); margin:0 0 .8rem;
}
.how{max-width:74ch; margin-left:auto; margin-right:auto}
.how p{margin:.6rem 0; font-size:.94rem; color:var(--ink-soft)}
.how-lede strong{color:var(--ink)}
.agents{margin:.6rem 0; padding-left:1.25rem}
.agents li{margin:.4rem 0; font-size:.94rem; color:var(--ink-soft)}
.agents strong{color:var(--ink)}
.rule{border:0; border-top:1px solid var(--hair); margin:40px 0 0}

/* articles
   Text sits in a centred reading measure; the visuals break out to
   the full width. Left-aligning the prose inside a 1120px wrap left a
   dead gutter down the whole right-hand side of every article. */
.article{padding:44px 0; border-bottom:1px solid var(--hair)}
.article:last-child{border-bottom:0}
.art-head,.dek,.body,.art-foot{max-width:68ch; margin-left:auto; margin-right:auto}
.dateline{
  margin:0 0 .5rem; color:var(--muted); font-size:.75rem;
  letter-spacing:.1em; text-transform:uppercase;
}
.headline{
  font-family:var(--serif); font-weight:700; margin:0;
  font-size:clamp(1.6rem,3.6vw,2.3rem); line-height:1.18;
  letter-spacing:-.008em;
}
/* The table of contents. Full-width like the visuals rather than
   inside the 68ch measure — it is a scanning surface, not prose, and
   at ~8 themes a single column would push the first article a screen
   and a half down the page. `auto-fit` + `minmax` gives 3 columns on a
   desktop and 1 on a phone with no media query and no JavaScript (the
   site's CSP is `script-src 'none'`). */
.toc{margin:1.6rem 0 0}
.toc-head{
  font-family:var(--sans); font-size:.72rem; font-weight:700;
  letter-spacing:.14em; text-transform:uppercase; color:var(--muted);
  margin:0 0 .9rem; display:flex; align-items:baseline; gap:.6rem;
  border-bottom:1px solid var(--hair); padding-bottom:.5rem;
}
.toc-total{
  font-weight:400; letter-spacing:.02em; text-transform:none;
  font-size:.75rem;
}
.toc-grid{
  display:grid; gap:1rem 1.6rem;
  grid-template-columns:repeat(auto-fit,minmax(255px,1fr));
}
.toc-card{min-width:0}
.toc-name{
  font-family:var(--serif); font-size:1.02rem; font-weight:700;
  margin:0 0 .4rem; line-height:1.25; color:var(--ink);
  display:flex; align-items:baseline; gap:.45rem;
}
.toc-count{
  font-family:var(--sans); font-size:.68rem; font-weight:600;
  color:var(--muted); background:var(--hair); border-radius:999px;
  padding:1px 7px; flex:none;
}
.toc-list{list-style:none; margin:0; padding:0}
.toc-list li{
  font-size:.86rem; line-height:1.4; margin:0 0 .35rem;
  display:flex; gap:.5rem;
}
.toc-when{color:var(--muted); font-size:.72rem; flex:none; padding-top:.12rem}
.toc-list a{color:var(--ink-soft); text-decoration:none}
.toc-list a:hover{color:var(--accent); text-decoration:underline}
/* The disclosure for the rest of a theme. Styled as a quiet control
   rather than a label, because the old "+17 more below" read as a
   statement and this is a button. */
.toc-rest{margin:.1rem 0 0}
.toc-rest > summary{
  cursor:pointer; color:var(--muted); font-size:.75rem;
  list-style:none; display:inline-flex; align-items:center; gap:.3rem;
  padding:.15rem 0;
}
.toc-rest > summary::-webkit-details-marker{display:none}
.toc-rest > summary::before{content:"▸"; font-size:.65rem}
.toc-rest[open] > summary::before{content:"▾"}
.toc-rest > summary:hover{color:var(--accent)}
.toc-rest[open] > summary{margin-bottom:.35rem}
/* The unsorted group is a holding pen, not a theme — it should read as
   pending rather than as a peer of the real ones. */
.toc-unsorted .toc-name{color:var(--muted); font-style:italic}

/* The summary is a standfirst, not a caption. Editor v1.2 writes
   ~120-150 words here, where v1.1 wrote ~50 — a size that reads as one
   emphatic line collapses into a grey slab at three times the length.
   So it takes a rule and a little indent: enough to stay distinct from
   the body without competing with the headline above it. Briefs
   published before v1.2 keep their short summary and simply occupy
   less of the same frame. */
/* Provenance sits between the headline and the summary — close enough
   to the headline to be read as a byline, quiet enough not to compete
   with it. Sized below the dateline above it so the header reads
   top-down in decreasing weight. */
.provenance{
  margin:.55rem 0 0; font-family:var(--sans); font-size:.72rem;
  color:var(--muted); letter-spacing:.01em; line-height:1.5;
}
.prov-role{
  text-transform:uppercase; letter-spacing:.08em; font-size:.64rem;
  color:var(--hair-ink,#9aa3ad); font-weight:600;
}

.dek{
  margin:1rem 0 0; padding:0 0 0 .95rem;
  border-left:3px solid var(--hair);
}
.dek p{
  margin:0 0 .55rem; font-size:1.02rem; line-height:1.6;
  color:var(--ink-soft);
}
.dek p:last-child{margin-bottom:0}

/* The permalink sits above the dateline, right-aligned and quiet. It
   is a utility, not part of the article — it exists so a reader can
   right-click and send the piece to someone. */
.entry{position:relative}
.permabar{
  max-width:68ch; margin:0 auto; text-align:right;
  font-size:.72rem; line-height:1; height:0;
}
.permalink{
  color:var(--muted); text-decoration:none; letter-spacing:.03em;
  position:relative; top:.15rem;
}
.permalink:hover{color:var(--accent); text-decoration:underline}
.entry:target .headline{
  /* Landing from a shared link should show you WHICH article you
     were sent, or the jump reads as an ordinary scroll position. */
  box-shadow:-.6rem 0 0 var(--accent);
}

.pager{
  display:flex; flex-wrap:wrap; align-items:center; gap:.4rem;
  justify-content:center; margin:2.5rem auto 0; max-width:68ch;
  padding-top:1.4rem; border-top:1px solid var(--hair);
}
.pager a,.pager span{
  font-size:.82rem; padding:.36rem .6rem; border-radius:4px;
  text-decoration:none; color:var(--ink-soft);
}
.pager a:hover{background:var(--hair); color:var(--accent)}
.pg-num{min-width:2rem; text-align:center}
.pg-here{background:var(--accent); color:#fff; font-weight:600}
.pg-off{color:var(--hair)}
.pg-gap{padding:.36rem .2rem; color:var(--muted)}
.short-notice{margin:0 0 .5rem}
.short-notice a{color:var(--muted); white-space:nowrap}
.chips{display:flex; flex-wrap:wrap; gap:6px; margin:1rem 0 0}
.chip{
  font-size:.7rem; letter-spacing:.04em; color:var(--muted);
  background:#f1f3f5; border:1px solid var(--hair);
  border-radius:999px; padding:2px 9px; white-space:nowrap;
}
.chip-ticker{
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
  font-weight:600; color:var(--ink); background:#fff;
}
.body{margin:1.6rem auto 0}
.body p{margin:0 0 1.05rem}
.body h2,.body h3{
  font-family:var(--serif); margin:2rem 0 .6rem; line-height:1.25;
}
.body h2{font-size:1.28rem}
.body h3{font-size:1.1rem}
.body a{color:var(--accent); text-decoration:underline;
  text-underline-offset:2px; text-decoration-thickness:1px}
.body a:hover{background:#eff4ff}
.body ul,.body ol{margin:0 0 1.05rem; padding-left:1.3rem}
.body li{margin:.3rem 0}
.body blockquote{
  margin:1.2rem 0; padding:.2rem 0 .2rem 1rem;
  border-left:3px solid var(--hair); color:var(--ink-soft);
}
.body table{border-collapse:collapse; width:100%; font-size:.9rem; margin:1.2rem 0}
.body th,.body td{border-bottom:1px solid var(--hair); padding:6px 8px; text-align:left}

/* visuals */
.visuals{margin:2.2rem 0 0}
.visuals-lede{margin:1.5rem 0 0}
.visuals-lede .vis-head{margin-top:1.3rem}
.vis-head{
  font-family:var(--sans); font-size:.72rem; letter-spacing:.14em;
  text-transform:uppercase; color:var(--muted);
  margin:1.8rem 0 .7rem; padding-bottom:.4rem;
  border-bottom:1px solid var(--hair);
}
.vis-note{margin:.5rem 0 0; font-size:.76rem; color:var(--muted)}
.strip,.table-wrap{overflow-x:auto; -webkit-overflow-scrolling:touch}
.strip table,.table-wrap table{min-width:520px}
.chart-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:14px}
@media (max-width:900px){.chart-grid{grid-template-columns:repeat(2,1fr)}}
@media (max-width:620px){.chart-grid{grid-template-columns:1fr}}

/* disclosures */
.art-foot{margin:1.8rem auto 0; display:flex; flex-direction:column; gap:.5rem}
.disclosure{
  border:1px solid var(--hair); border-radius:6px;
  background:var(--card); padding:0;
}
.disclosure summary{
  cursor:pointer; padding:9px 13px; font-size:.78rem; color:var(--muted);
  letter-spacing:.06em; text-transform:uppercase; list-style:none;
}
.disclosure summary::-webkit-details-marker{display:none}
.disclosure summary::before{content:"\25B8  "; color:var(--muted)}
.disclosure[open] summary::before{content:"\25BE  "}
.disclosure[open] summary{border-bottom:1px solid var(--hair)}
.sources{margin:0; padding:10px 13px 12px 30px; font-size:.82rem}
.sources li{margin:.3rem 0; color:var(--ink-soft)}
.src-internal{
  margin:0; padding:8px 13px 12px; color:var(--muted);
  font-size:.78rem; line-height:1.5; border-top:1px solid var(--hair);
}
.src-domain{color:var(--muted); font-size:.74rem}
.sources a{color:var(--accent)}
.hyp{margin:0; padding:10px 15px; color:var(--ink-soft); font-size:.9rem}
.hyp p{margin:.4rem 0}
.hyp-meta{
  margin:10px 15px 0; font-size:.72rem; color:var(--muted);
  letter-spacing:.05em; text-transform:uppercase;
}

/* footer */
.site-foot{margin:52px auto 0; padding-top:22px; border-top:3px double var(--ink)}
.site-foot{max-width:74ch; margin-left:auto; margin-right:auto}
.site-foot p{margin:.3rem 0; font-size:.78rem; color:var(--muted)}
.built{color:#9aa1ab !important}
.empty{color:var(--muted); padding:40px 0}

@media (prefers-color-scheme:dark){
  :root{
    --ink:#e8eaed; --ink-soft:#b9bfc7; --muted:#8b939d; --hair:#2a2f36;
    --bg:#14171a; --card:#1b1f24; --accent:#7aa7ff;
  }
  /* A PNG cannot recolour itself, so the navy mark is swapped for
     the near-white one rather than filtered — a CSS invert would take
     the gold slash with it and turn it blue. */
  .mark img.mark-light{display:none}
  .mark img.mark-dark{display:block}
  .disclaimer{background:#2a1c12; border-color:#5c3a1e; border-left-color:#ea8c4b}
  .disc-head{color:#f0a868}
  .chip{background:#22272e}
  .chip-ticker{background:#1b1f24}
  .body a:hover{background:#1e2a44}
  /* The chart cards and tables carry their own light ground; keep
     them on white rather than letting dark text land on it. */
  .strip,.chart-grid,.table-wrap{
    background:#fff; border-radius:8px; padding:10px; color:#111418;
  }
}

/* --- Search ------------------------------------------------------- */
.mast-search{margin:14px auto 0; max-width:34rem}
.masthead-slim + .mast-search{margin:10px 0 0}
.mast-search input{
  width:100%; box-sizing:border-box; padding:8px 12px;
  font:inherit; font-size:.95rem; color:inherit;
  background:transparent; border:1px solid #c9c2b4; border-radius:8px;
}
.mast-search input:focus{outline:2px solid #1d3557; outline-offset:1px}
.search-main{max-width:68ch; margin:0 auto}
.sr-status{color:#6b6455; font-size:.92rem; margin:18px 0 6px}
.search-results{list-style:none; margin:0; padding:0}
.search-results li{margin:0 0 22px; padding:0}
.sr-meta{color:#6b6455; font-size:.82rem; letter-spacing:.02em;
  text-transform:uppercase; margin:0 0 2px}
.sr-title{margin:0; font-size:1.08rem; line-height:1.35}
.sr-title a{color:inherit; text-decoration:none}
.sr-title a:hover{text-decoration:underline}
.sr-sum{color:#4c463a; margin:3px 0 0; font-size:.95rem; line-height:1.5}
@media (prefers-color-scheme: dark){
  .mast-search input{border-color:#3a3f46}
  .mast-search input:focus{outline-color:#8fb4e8}
  .sr-status,.sr-meta{color:#9aa3ad}
  .sr-sum{color:#b7bec7}
}

/* --- The setup panel (v1.6 structured closer) --------------------- */
.setup-panel{margin:26px 0 8px; padding:16px 18px; border:1px solid #d9d2c2;
  border-radius:9px; background:rgba(0,0,0,0.015)}
.setup-head{margin:0 0 10px; font-size:.8rem; font-weight:650;
  letter-spacing:.09em; text-transform:uppercase; color:#6b6455}
.setup-row{display:grid; grid-template-columns:9.5rem 1fr; gap:10px;
  padding:5px 0; font-size:.92rem; line-height:1.5}
.setup-k{color:#6b6455; font-weight:600}
@media (max-width:560px){ .setup-row{grid-template-columns:1fr} }
@media (prefers-color-scheme: dark){
  .setup-panel{border-color:#3a3f46; background:rgba(255,255,255,0.03)}
  .setup-head,.setup-k{color:#9aa3ad}
}
</style>
</head>

(function () {
  "use strict";

    searchOptions: { combineWith: "AND" }

      return;
    }
    var ids = mini.search(q, { prefix: true, combineWith: "AND" })
      .map(function (r) { return r.id; });
    var close = false;
    if (!ids.length) {
      ids = mini.search(q, { prefix: true, fuzzy: 0.2, combineWith: "AND" })
        .map(function (r) { return r.id; });
      close = true;
    }
    ids = ids.filter(function (id) { return pos[id] !== undefined; });
    ids.sort(function (a, b) { return pos[a] - pos[b]; });
    if (!ids.length) {
      status.textContent = "No matches for \u201c" + q + "\u201d \u2014 try a ticker, company name, or sector.";
      return;
    }
    status.textContent = ids.length + (ids.length === 1 ? " article" : " articles")
      + " \u00b7 newest first"
      + (close ? " \u00b7 showing close matches for \u201c" + q + "\u201d" : "");
    ids.forEach(function (id) {
      var d = docs[pos[id]];
      var li = document.createElement("li");
      var meta = document.createElement("p");
      meta.className = "sr-meta";
      meta.textContent = d.shown + " \u00b7 " + d.theme;
      var head = document.createElement("p");
      head.className = "sr-title";
      var a = document.createElement("a");
      a.href = d.page;
      a.textContent = d.title;
      head.appendChild(a);
      var sum = document.createElement("p");
      sum.className = "sr-sum";
      sum.textContent = d.summary;
      li.appendChild(meta);
      li.appendChild(head);
      li.appendChild(sum);
      list.appendChild(li);
    });
  }

  var timer = null;
  input.addEventListener("input", function () {
    clearTimeout(timer);
    timer = setTimeout(function () {
      var q = input.value;
      try {
        var u = new URL(window.location.href);
        if (q) { u.searchParams.set("q", q); }
        else { u.searchParams.delete("q"); }
        history.replaceState(null, "", u);
      } catch (e) { /* file:// in some browsers */ }
      render(q);
    }, 150);
  });

  var initial = "";
  try {
    initial = new URLSearchParams(window.location.search).get("q") || "";
  } catch (e) { initial = ""; }
  if (initial) { input.value = initial; }
  render(initial);
  input.focus();
})();
</script>
</body>
</html>
